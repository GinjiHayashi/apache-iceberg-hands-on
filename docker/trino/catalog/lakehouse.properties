# Trino から Polaris（Iceberg REST カタログ）の lakehouse カタログに接続する設定
connector.name=iceberg

# --- カタログ: Polaris の REST API に OAuth2（client credentials）で接続する ---
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
iceberg.rest-catalog.warehouse=lakehouse
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=${ENV:POLARIS_CLIENT_ID}:${ENV:POLARIS_CLIENT_SECRET}
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
iceberg.rest-catalog.oauth2.server-uri=http://polaris:8181/api/catalog/v1/oauth/tokens
# Polaris から一時的な S3 認証情報を払い出してもらう（vended credentials）
iceberg.rest-catalog.vended-credentials-enabled=true

# --- ストレージ: RustFS（S3 互換） ---
# Trino は払い出された認証情報のうちキーだけを使うので、接続先はここで指定する
fs.s3.enabled=true
s3.endpoint=http://rustfs:9000
s3.region=us-east-1
s3.path-style-access=true

# 06_parquet_conversion の追加目標（Trino の add_files）で使う
iceberg.add-files-procedure.enabled=true

# 07_maintenance 用: expire_snapshots / remove_orphan_files で直近のものも対象にできるようにする
# （既定は 7 日。本番では並行する書き込みを壊さないよう、既定のままにする）
iceberg.expire-snapshots.min-retention=0s
iceberg.remove-orphan-files.min-retention=0s
